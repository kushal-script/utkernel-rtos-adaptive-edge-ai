# OpenOCD target config for STM32H533RETx (NUCLEO-H533RE)
# Cortex-M33 r0p4 with TrustZone (disabled in BSP Phase 1), 512 KB Flash, 272 KB SRAM
# SWD DPIDR: 0x6ba02477  DBGMCU IDCODE: 0x0484
#
# Requires: OpenOCD HEAD (0.12.0+dev) + interface/stlink.cfg with swd transport
# Verified working: STLINK V3J13M4 (API v3) on NUCLEO-H533RE

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME stm32h533re
}

# SWD DPIDR for Cortex-M33 (ARM ID, same across STM32H/U/L5 families)
set _CPUTAPID 0x6ba02477

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# Flash: 512 KB at 0x08000000 — use stm32l4x driver (closest available in 0.12.0+dev)
# Sector erase works; sector size = 8 KB for STM32H533
flash bank $_CHIPNAME.flash     stm32l4x 0x08000000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash_s   stm32l4x 0x0C000000 0 0 0 $_TARGETNAME

# Work area: top of SRAM1, 32 KB for flash loader
$_TARGETNAME configure -work-area-phys 0x20038000 -work-area-size 0x8000 -work-area-backup 0

# No SRST on Nucleo SWD connector — rely on SYSRESETREQ via AIRCR
reset_config none

$_TARGETNAME configure -event reset-init {
    adapter speed 4000
}
$_TARGETNAME configure -event reset-start {
    adapter speed 500
}
