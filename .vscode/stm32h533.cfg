# OpenOCD target config for STM32H533RETx (NUCLEO-H533RE) — debug only
# Cortex-M33 r0p4 with TrustZone (disabled in Phase 1), 512 KB Flash, 272 KB SRAM
# SWD DPIDR: 0x6ba02477  DBGMCU IDCODE: 0x0484
#
# Requires: OpenOCD HEAD (0.12.0+dev) + interface/stlink.cfg with swd transport.
# Flashing is done via STM32_Programmer_CLI, not OpenOCD. This file is only
# used by cortex-debug (VS Code) to attach a GDB session to a running target.

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

adapter speed 500

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME stm32h533re
}

# SWD DPIDR for Cortex-M33 (ARM ID, same across STM32H/U/L5 families)
set _CPUTAPID 0x6ba02477

swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
$_TARGETNAME cortex_m reset_config sysresetreq

# No flash bank driver registered — OpenOCD 0.12.0+dev has no stm32h5x driver,
# and the stm32l4x fallback reads DBGMCU from the wrong address. Flashing is
# delegated to STM32_Programmer_CLI (see README / Phase 1 commit).

# With blank or stale flash the CPU can enter lockup immediately on reset.
# OpenOCD's lockup-clearing sequence writes to DWT/FPB which fails and sets
# WDATAERR in DP CTRL/STAT, blocking all subsequent DAP access. Clear it on
# examine-end and disable background polling so the same fault doesn't recur.
$_TARGETNAME configure -event examine-end {
    catch { stm32h533re.dap dpreg 0 0x0000001E }
    catch { poll off }
}

reset_config none

$_TARGETNAME configure -event reset-init {
    adapter speed 4000
}
$_TARGETNAME configure -event reset-start {
    adapter speed 500
}
